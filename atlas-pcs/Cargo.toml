[package]
name = "atlas-pcs"
version = "0.1.0"
edition = "2021"
description = "The atlas polynomial commitment interface and the Akita scheme."

[features]
test-feature = ["atlas-sumcheck/test-feature"]

[dependencies]
# Internal
common.workspace = true
atlas-trace.workspace = true
atlas-algebra.workspace = true
atlas-transcript.workspace = true
atlas-sumcheck.workspace = true

# Serialization
serde = { workspace = true, features = ["alloc", "rc"] }

# Cryptography and Math
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", features = ["std", "parallel", "asm"] }
ark-serialize.workspace = true
ark-std.workspace = true
sha3 = "0.10.8"
blake2 = "0.10"
jolt-field = { workspace = true, features = ["solinas", "asm"] }
jolt-transcript = { workspace = true, features = ["solinas", "transcript-blake2b", "transcript-keccak"] }
jolt-utils.workspace = true
jolt-poly = { workspace = true, features = ["parallel", "transcript"] }
jolt-sumcheck.workspace = true
# LayerZero's Akita lattice PCS, behind `akita::backend`.
akita-algebra = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-config = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-error = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-pcs = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false, features = ["parallel", "transcript-blake2b"] }
akita-challenges = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-planner = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-schedules = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-types = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
akita-params = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "dfdbd7674cab5cfbe95243e947d1b10a982f232b", default-features = false }
bincode.workspace = true
spongefish = { version = "=0.8.0", default-features = false, features = ["keccak"] }

# Numeric
num.workspace = true
num-derive.workspace = true
num-traits.workspace = true

# Parallel Processing
rayon.workspace = true

# Randomness
rand.workspace = true
rand_chacha = { version = "0.3.0", default-features = false }
rand_core.workspace = true
rand_distr = "0.4.3"

# Tracing and Profiling
tracing.workspace = true
inferno = { version = "0.12.3", optional = true }
allocative.workspace = true

# Core Utilities
thiserror = { workspace = true, default-features = true }
strum.workspace = true
strum_macros.workspace = true
fixedbitset = "0.5.0"
derive_more.workspace = true
itertools.workspace = true

# System and Platform
sysinfo = { version = "0.30.8", optional = true }
memory-stats = { version = "1.0.0", features = ["always_use_statm"] }

# Testing
serial_test.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true
atlas-transcript = { workspace = true, features = ["prover", "test-feature"] }
