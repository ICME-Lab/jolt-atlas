# nextest configuration (https://nexte.st/docs/configuration/)

[profile.default]
fail-fast = false
# A test is "slow" after 60 s and is killed after 10 × 60 s.
slow-timeout = { period = "60s", terminate-after = 10 }
status-level = "slow"
final-status-level = "slow"

[profile.ci]
inherits = "default"
failure-output = "immediate-final"
retries = 0
# GitHub's 4-vCPU, 16 GB runners lose the job to memory starvation with four Akita
# proofs in flight; two fit.
test-threads = 2

[profile.ci.junit]
path = "junit.xml"

# Real GPT-2 / BGE / Qwen: one at a time, generous timeouts, timings printed.
[profile.heavy]
inherits = "ci"
test-threads = 1
slow-timeout = { period = "300s", terminate-after = 9 }
success-output = "final"

# The exhaustive soundness sweeps prove once per site; the witness sweep takes
# about 37 min on an M3 under Akita, so give them twice the heavy budget.
[[profile.heavy.overrides]]
filter = 'test(soundness)'
slow-timeout = { period = "300s", terminate-after = 18 }
