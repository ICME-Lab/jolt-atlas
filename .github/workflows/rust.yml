name: Build and Test Jolt-Atlas
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**', main]

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check

  clippy-and-test:
    name: Clippy & Test (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            clippy_args: --workspace --all-targets
            test_args: --workspace
          - name: zk
            # Native BlindFold lives in joltworks. Exercise its ZK tests as
            # part of the required matrix, separately from the ONNX prototype.
            clippy_args: -p joltworks --all-targets --features zk
            test_args: -p joltworks --features zk
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy ${{ matrix.variant.clippy_args }}
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run ${{ matrix.variant.test_args }}

  experimental-onnx-zk:
    name: Experimental ONNX ZK (informational)
    runs-on: ubuntu-latest
    # This dispatcher still lacks several operator relations. Keep its build
    # and complete test results visible without conflating it with native ZK.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Check experimental dispatcher
        id: clippy
        continue-on-error: true
        run: cargo clippy -p jolt-atlas-core --all-targets --features zk
      - uses: taiki-e/install-action@nextest
      - name: Run experimental tests
        id: tests
        continue-on-error: true
        run: cargo nextest run -p jolt-atlas-core --features zk --no-fail-fast
      - name: Report experimental results
        if: always()
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          {
            echo '## Experimental ONNX ZK'
            echo 'The supported native BlindFold suite runs in Clippy & Test (zk).'
            echo 'This separate ONNX dispatcher is incomplete and informational.'
            echo "Clippy result: $CLIPPY_OUTCOME"
            echo "Test result: $TEST_OUTCOME"
            echo 'See the job logs for every compiler diagnostic and test failure.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CLIPPY_OUTCOME" != success || "$TEST_OUTCOME" != success ]]; then
            echo '::warning::Experimental ONNX ZK failed. These results do not establish a working ONNX ZK dispatcher.'
            exit 1
          fi

  test-gpt2:
    name: GPT-2 Prove & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download GPT-2 ONNX model
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python scripts/download_gpt2.py
      - uses: taiki-e/install-action@nextest
      - name: Run GPT-2 test
        run: cargo nextest run --workspace --run-ignored ignored-only -E 'test(test_gpt2_dory)'

  test-bge:
    name: BGE Prove & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download BGE ONNX model
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python scripts/download_bge_small_en_v1_5.py
      - uses: taiki-e/install-action@nextest
      - name: Run BGE test
        run: cargo nextest run --workspace --run-ignored ignored-only -E 'test(test_bge_small_en_v1_5)'

  build-wasm-atlas-onnx-tracer:
    name: Build Wasm - atlas-onnx-tracer
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Adead_code -Aunused_imports -Aunused_variables -Aunused_mut"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build Wasm
        run: cargo build -p atlas-onnx-tracer --release --target wasm32-unknown-unknown
