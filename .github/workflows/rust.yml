name: Build and Test Jolt-Atlas
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**', main]

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check

  clippy-and-test:
    name: Clippy & Test (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            clippy_args: --workspace --all-targets
            test_args: --workspace
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy ${{ matrix.variant.clippy_args }}
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run ${{ matrix.variant.test_args }}

  zoo-gates:
    name: Model zoo import gates & goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - name: Decode / analyze / import gates + golden output hashes
        run: cargo nextest run -p atlas-onnx-import --run-ignored ignored-only

  test-gpt2:
    name: GPT-2 Prove & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download GPT-2 ONNX model
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python scripts/download_gpt2.py
      - uses: taiki-e/install-action@nextest
      - name: Run GPT-2 test
        run: cargo nextest run --workspace --run-ignored ignored-only -E 'test(test_gpt2_dory)'
      - name: GPT-2 golden output hash
        run: cargo nextest run -p atlas-onnx-import --run-ignored ignored-only -E 'test(golden_zoo_big)'

  test-bge:
    name: BGE Prove & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download BGE ONNX model
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python scripts/download_bge_small_en_v1_5.py
      - uses: taiki-e/install-action@nextest
      - name: Run BGE test
        run: cargo nextest run --workspace --run-ignored ignored-only -E 'test(test_bge_small_en_v1_5)'
      - name: BGE golden output hash
        run: cargo nextest run -p atlas-onnx-import --run-ignored ignored-only -E 'test(golden_zoo_big)'

