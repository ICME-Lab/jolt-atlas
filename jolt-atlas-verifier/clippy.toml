# The verifier's dependency cone stays prover-free at item level. The protocol crates ship both
# sides, as upstream's do.
# Our crates keep prover items in `prover` submodules, which CI's verifier-isolation job rejects
# by path (`::prover` / `::witness` segments in this crate's sources); this list names the public
# prover items that live elsewhere (the vendored crates' prover surface, and our prover methods
# on shared types) and, as a second line behind the path check, the prover items of the
# sumcheck engine and the relation core. `allow-invalid` marks items behind a feature the
# verifier's build leaves off (atlas-transcript's `prover`).
#
# The crate is also Trace-free: nothing here names the execution trace or its witness types, so
# witness construction lives in jolt-atlas-core (`disallowed-types` below; CI greps for
# `trace::Trace` as the backstop).
disallowed-methods = [
    { path = "atlas_transcript::prover_transcript", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::prove_batch", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::round_check_failed", reason = "prover-only" },
    { path = "atlas_sumcheck::relation::prover::prove_relation", reason = "prover-only" },
    { path = "atlas_sumcheck::relation::prover::prove_relation_batch", reason = "prover-only" },
    { path = "atlas_sumcheck::relation::prover::prove_relation_batch_parallel", reason = "prover-only" },
    { path = "atlas_sumcheck::evaluation_reduction::EvalReductionProtocol::prove", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::setup_prover", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::commit", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::batch_commit", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::batch_commit_all", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::combine_hints", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::prove", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::CommitmentScheme::prove_rlc", reason = "prover-only" },
]
disallowed-types = [
    { path = "atlas_trace::trace::Trace", reason = "the verifier is Trace-free; witness construction lives in jolt-atlas-core" },
    { path = "atlas_trace::trace::FusedIntermediates", reason = "the verifier is Trace-free; witness construction lives in jolt-atlas-core" },
    { path = "atlas_trace::trace::NodeAux", reason = "the verifier is Trace-free; witness construction lives in jolt-atlas-core" },
    { path = "atlas_trace::trace::SoftmaxWitness", reason = "the verifier is Trace-free; witness construction lives in jolt-atlas-core" },
    { path = "atlas_transcript::ProverTranscript", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::ProveRounds", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::MemberRound", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::MemberFinish", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::RoundScheduler", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::ProvedBatch", reason = "prover-only" },
    { path = "atlas_sumcheck::engine::prover::ClearSumcheckRecorder", reason = "prover-only" },
    { path = "atlas_transcript::sponge::SpongeProver", reason = "prover-only", allow-invalid = true },
    { path = "atlas_transcript::transcript::ProvingTranscript", reason = "prover-only" },
    { path = "atlas_pcs::commitment_scheme::StreamingCommitmentScheme", reason = "prover-only" },
    { path = "atlas_sumcheck::relation::prover::RelationWitness", reason = "prover-only" },
    { path = "atlas_sumcheck::relation::prover::DynRelationWitness", reason = "prover-only" },
]
