# The `jolt-poly` name the external `akita-*` crates depend on (by git, at a16z/jolt), resolved by
# the root `[patch."https://github.com/a16z/jolt"]` to this owned package. It re-exports exactly
# the univariate types `akita-*` binds from atlas-algebra; it holds no code of its own.
[package]
name = "jolt-poly"
version = "0.1.0"
edition = "2021"
description = "The akita-* surface of atlas-algebra's univariate polynomials, under the name akita-* depends on."
publish = false

[dependencies]
atlas-algebra.workspace = true
