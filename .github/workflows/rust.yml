name: Build and Test Jolt-Atlas
permissions:
  contents: read

on:
  push:
    # `dev` gets the fast jobs (fmt, clippy, isolation, workspace tests) on every push.
    branches: [main, dev]
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly: real models + exhaustive soundness sweeps.
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Full debuginfo on opt-level-3 test binaries is most of the cache; line
  # tables keep backtraces useful.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel a main/nightly heavy run because another push landed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets

  verifier-isolation:
    # The verifier crate must build alone and never depend on the prover.
    name: Verifier isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
          cache-on-failure: true
      - run: cargo check -p jolt-atlas-verifier
      - name: No jolt-atlas-core in the verifier's dependency tree
        run: |
          if cargo tree -p jolt-atlas-verifier -e normal,build --prefix none | grep -q '^jolt-atlas-core '; then
            echo "jolt-atlas-verifier depends on jolt-atlas-core" >&2
            exit 1
          fi
      - name: No BN254 curve crates in any member's dependency graph
        # Vendored upstream crates keep optional BN254 features, so they are resolved with their
        # default features off; atlas crates are resolved as built.
        run: |
          status=0
          for row in $(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | "\(.name),\(.manifest_path | contains("/third_party/"))"'); do
            name=${row%,*}
            flags=""
            if [ "${row#*,}" = true ]; then flags=--no-default-features; fi
            if cargo tree -p "$name" $flags -e normal,build --prefix none | grep -qE '^(ark-bn254|ark-ec) '; then
              echo "$name resolves ark-bn254 or ark-ec" >&2
              status=1
            fi
          done
          exit $status

  test:
    # Unit tests, the exhaustive op-surface table, the soundness sweeps, the
    # checked-in zoo (op gauntlet + tiny GPT-2 / Qwen2 / BERT stand-ins)
    # end to end, and the importer's zoo gates and golden hashes.
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Workspace tests
        run: cargo nextest run --workspace --profile ci
      - name: Full-zoo import gates (checked-in models)
        run: >
          cargo nextest run -p atlas-onnx-import --profile ci
          --run-ignored ignored-only -E 'not test(golden_zoo_big)'

  heavy-models:
    # Real GPT-2, BGE and Qwen2-0.5B: main, nightly, workflow_dispatch, and
    # PRs labelled `ci:heavy`; not `dev` pushes.
    name: Real model (${{ matrix.model.name }})
    needs: test
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model:
          - name: gpt2
            dir: models/gpt2
            script: download_gpt2.py
            test: 'test(/zoo::gpt2$/)'
          - name: bge
            dir: models/bge-small-en-v1.5
            script: download_bge_small_en_v1_5.py
            test: 'test(/zoo::bge_small_en_v1_5$/)'
          - name: qwen
            dir: models/qwen
            script: download_qwen.py
            test: 'test(/zoo::qwen$/)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Restore ${{ matrix.model.name }} export
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.model.dir }}
          key: model-${{ matrix.model.name }}-${{ hashFiles(format('scripts/{0}', matrix.model.script), 'scripts/onnx_export_utils.py', 'scripts/requirements-models.txt') }}
      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-models.txt
      - name: Export ${{ matrix.model.name }} to ONNX
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/${{ matrix.model.script }}
      - name: Prove & verify
        run: >
          cargo nextest run -p jolt-atlas-core --profile heavy
          --run-ignored ignored-only -E '${{ matrix.model.test }}'
      - name: Golden forward hash
        run: >
          cargo nextest run -p atlas-onnx-import --profile heavy
          --run-ignored ignored-only -E 'test(golden_zoo_big)'

  soundness-exhaustive:
    # Every mutation site, every witness element, every opening id.
    name: Exhaustive soundness sweeps
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      JOLT_SOUNDNESS_EXHAUSTIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: >
          cargo nextest run -p jolt-atlas-core --profile heavy
          -E 'test(soundness)'
