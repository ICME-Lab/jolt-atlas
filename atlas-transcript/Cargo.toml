[package]
name = "atlas-transcript"
version = "0.1.0"
edition = "2021"
description = "The atlas Fiat-Shamir transcript, on spongefish."

[features]
# The prover's proof-of-work nonce search copies the sponge state, which spongefish 0.8.0
# exposes only under `yolocrypto`; verifier builds leave it off.
prover = ["spongefish/yolocrypto"]
test-feature = ["prover"]

[dependencies]
# Internal
common.workspace = true
atlas-trace.workspace = true
atlas-algebra.workspace = true

# Serialization
serde.workspace = true

# Cryptography and Math
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", features = ["std", "parallel", "asm"] }
ark-serialize.workspace = true
ark-std.workspace = true
sha3 = "0.10.8"
# spongefish 0.8's `Hash` bridge takes a `digest 0.11` hash.
blake2 = "0.11.0-rc.6"
jolt-field = { workspace = true, features = ["solinas", "asm"] }
bincode.workspace = true
spongefish = { version = "=0.8.0", default-features = false, features = ["getrandom", "turboshake128"] }

# Numeric
num.workspace = true
num-derive.workspace = true
num-traits.workspace = true

# Parallel Processing
rayon.workspace = true

# Randomness
rand.workspace = true
rand_chacha = { version = "0.3.0", default-features = false }
rand_core.workspace = true
rand_distr = "0.4.3"

# Tracing and Profiling
tracing.workspace = true
inferno = { version = "0.12.3", optional = true }
allocative.workspace = true

# Core Utilities
thiserror = { workspace = true, default-features = true }
strum.workspace = true
strum_macros.workspace = true
fixedbitset = "0.5.0"
derive_more.workspace = true
itertools.workspace = true

# System and Platform
sysinfo = { version = "0.30.8", optional = true }
memory-stats = { version = "1.0.0", features = ["always_use_statm"] }

# Testing
serial_test.workspace = true

# spongefish seeds the prover's private RNG from getrandom 0.4, which needs an explicit backend
# on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { version = "0.4", package = "getrandom", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
tracing-subscriber.workspace = true
atlas-transcript = { path = ".", features = ["prover", "test-feature"] }
