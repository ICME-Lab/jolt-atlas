[package]
name = "jolt-atlas"
version = "0.1.0"
authors = [
    "Wyatt Benno <wyatt@icme.io>",
    "Khalil Gibran Hassam <khalilhassam4@gmail.com>",
    "Alberto Centelles Hidalgo <zk_albi@proton.me>",
    "Antoine Douchet <antoinedcht@hotmail.com>",
]
edition = "2021"
description = "Lookup centric Jolt zkVM heavily modified by ICME Labs for zero knowledge machine learning."
documentation = "https://github.com/ICME-Lab/jolt-atlas/README.md"
repository = "https://github.com/ICME-Lab/jolt-atlas"
license-file = "LICENSE"
keywords = ["SNARK", "cryptography", "proofs", "zkML"]

[workspace]
members = [
    "jolt-atlas-core",
    "jolt-atlas-verifier",
    "crates/atlas-trace",
    "crates/atlas-onnx-import",
    "common",
    "crates/atlas-algebra",
    "crates/atlas-transcript",
    "crates/atlas-lookup-tables",
    "crates/atlas-sumcheck",
    "crates/atlas-claims",
    "crates/atlas-pcs",
]

[workspace.dependencies]
# Internal
atlas-trace = { path = "./crates/atlas-trace" }
atlas-onnx-import = { path = "./crates/atlas-onnx-import" }
common = { path = "./common" }
atlas-algebra = { path = "./crates/atlas-algebra", default-features = false }
atlas-transcript = { path = "./crates/atlas-transcript", default-features = false }
atlas-lookup-tables = { path = "./crates/atlas-lookup-tables", default-features = false }
atlas-sumcheck = { path = "./crates/atlas-sumcheck", default-features = false }
atlas-claims = { path = "./crates/atlas-claims" }
atlas-pcs = { path = "./crates/atlas-pcs", default-features = false }
jolt-atlas-verifier = { path = "./jolt-atlas-verifier" }

# Cryptography and Math
jolt-akita = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a", default-features = false, features = ["parallel"] }
jolt-field = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a", default-features = false, features = ["solinas"] }
jolt-poly = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a", default-features = false }
jolt-openings = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a", default-features = false }
jolt-transcript = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a", default-features = false, features = ["transcript-keccak"] }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

# Numeric
num = "0.4.3"
num-derive = "0.4.2"
num-traits = "0.2.19"

# Serialization
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }

# Parallel Processing
rayon = "1.10"

# Hashing
blake3 = "1.8"

# Randomness
rand = { version = "0.8.5", default-features = false }
rand_core = { version = "0.6.4", default-features = false }

# Tracing and Profiling
tracing = { version = "0.1.37", default-features = false }
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Core Utilities
derive_more = { version = "2.0.1", default-features = false, features = [
    "from",
] }
itertools = "0.10.0"
strum = { version = "0.26.3", default-features = false }
strum_macros = "0.26.4"
thiserror = { version = "1.0.58", default-features = false }

# Testing
serial_test = "3.2.0"

[lib]
path = "./src/lib.rs"


[dev-dependencies]
bincode = { version = "2.0.1", features = ["serde"] }


[dependencies]
jolt-atlas-core = { path = "./jolt-atlas-core" }

[profile.test]
opt-level = 3
lto = "off"

[profile.release]
debug = 1
overflow-checks = true
lto = "fat"

[profile.build-fast]
inherits = "release"
incremental = true
lto = "off"
overflow-checks = true

[profile.guest]
inherits = "release"
debug = false

[patch.crates-io]
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

# LayerZero pins these crates to a different Jolt revision. Use the adapter's
# revision for both sides so the field, polynomial and transcript types agree.
# The GitHub redirect hostname gives Cargo a distinct patch source for the same repo.
[patch."https://github.com/a16z/jolt"]
jolt-field = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a" }
jolt-poly = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a" }
jolt-transcript = { git = "https://www.github.com/a16z/jolt", rev = "fe1cc674aa40a6036ff7310ee2344644bb45093a" }

# Jolt declares this dependency by branch. Keep the serialization crates at the
# audited revision, using a distinct Cargo patch source.
[patch."https://github.com/a16z/arkworks-algebra"]
ark-serialize = { git = "https://www.github.com/a16z/arkworks-algebra", rev = "b8f0f5129501c42c8a934f4832746d335c8f8ca1" }
