[package]
name = "jolt-atlas-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal
atlas-trace = { workspace = true, features = ["test-util"] }
atlas-onnx-import.workspace = true
common.workspace = true
joltworks = { workspace = true, features = ["prover"] }
jolt-atlas-verifier.workspace = true
jolt-field.workspace = true
jolt-poly.workspace = true
jolt-sumcheck.workspace = true
jolt-claims.workspace = true

# Cryptography and Math
ark-bn254.workspace = true
ark-std.workspace = true
ark-serialize.workspace = true

# Numeric
num.workspace = true
num-derive.workspace = true
num-traits.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true

# Parallel Processing
rayon.workspace = true

# Randomness
rand.workspace = true
rand_core.workspace = true

# Tracing and Profiling
tracing.workspace = true
tracing-chrome.workspace = true
tracing-subscriber.workspace = true

# Core Utilities
derive_more.workspace = true
itertools.workspace = true
regex.workspace = true
strum.workspace = true
strum_macros.workspace = true

# Testing
serial_test.workspace = true

[dev-dependencies]
# `&mut` proof-field accessors for testing/mutate.rs.
jolt-atlas-verifier = { workspace = true, features = ["test-util"] }
# Digest of serialized proofs in the cross-stage digest harness.
blake2 = "0.10"
# Enable test-feature for joltworks during tests only
joltworks = { workspace = true, features = ["test-feature"] }
# Descriptor-driven zoo inputs shared with the importer's golden tests.
atlas-onnx-import = { workspace = true, features = ["test-util"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
