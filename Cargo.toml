[package]
name = "jolt-atlas"
version = "0.1.0"
authors = [
    "Wyatt Benno <wyatt@icme.io>",
    "Khalil Gibran Hassam <khalilhassam4@gmail.com>",
    "Alberto Centelles Hidalgo <zk_albi@proton.me>",
    "Antoine Douchet <antoinedcht@hotmail.com>",
]
edition = "2021"
description = "Lookup centric Jolt zkVM heavily modified by ICME Labs for zero knowledge machine learning."
documentation = "https://github.com/ICME-Lab/jolt-atlas/README.md"
repository = "https://github.com/ICME-Lab/jolt-atlas"
license-file = "LICENSE"
keywords = ["SNARK", "cryptography", "proofs", "zkML"]

[workspace]
members = [
    "jolt-atlas-core",
    "jolt-atlas-verifier",
    "third_party/jolt-field",
    "third_party/jolt-transcript",
    "third_party/jolt-poly",
    "third_party/jolt-sumcheck",
    "third_party/jolt-utils",
    "third_party/jolt-claims",
    "third_party/jolt-claims-derive",
    "third_party/jolt-akita",
    "atlas-trace",
    "atlas-onnx-import",
    "common",
    "joltworks",
]
# Vendored as dependencies of `jolt-claims` only; their upstream tests need crates we do not
# vendor (`tracer`, `jolt-dory`), so they stay out of workspace test runs.
exclude = [
    "third_party/jolt-crypto",
    "third_party/jolt-lookup-tables",
    "third_party/jolt-openings",
    "third_party/jolt-r1cs",
    "third_party/jolt-riscv",
]

[workspace.dependencies]
# Internal
atlas-trace = { path = "./atlas-trace" }
atlas-onnx-import = { path = "./atlas-onnx-import" }
common = { path = "./common" }
joltworks = { path = "./joltworks", default-features = false }
jolt-atlas-verifier = { path = "./jolt-atlas-verifier" }
# Vendored upstream crates (third_party/PINS.md records each pin).
jolt-field = { path = "./third_party/jolt-field", default-features = false }
jolt-transcript = { path = "./third_party/jolt-transcript", default-features = false }
jolt-utils = { path = "./third_party/jolt-utils" }
jolt-poly = { path = "./third_party/jolt-poly", default-features = false }
jolt-sumcheck = { path = "./third_party/jolt-sumcheck" }
jolt-claims = { path = "./third_party/jolt-claims" }
jolt-akita = { path = "./third_party/jolt-akita" }
jolt-openings = { path = "./third_party/jolt-openings", default-features = false }

# Cryptography and Math
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false, features = [
    "derive",
] }
ark-std = { version = "0.5.0", default-features = false }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

# Numeric
num = "0.4.3"
num-derive = "0.4.2"
num-traits = "0.2.19"

# Serialization
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }

# Parallel Processing
rayon = "1.10"

# Randomness
rand = { version = "0.8.5", default-features = false }
rand_core = { version = "0.6.4", default-features = false }

# Tracing and Profiling
tracing = { version = "0.1.37", default-features = false }
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Core Utilities
derive_more = { version = "2.0.1", default-features = false, features = [
    "from",
] }
itertools = "0.10.0"
regex = "1.10.6"
strum = { version = "0.26.3", default-features = false }
strum_macros = "0.26.4"
thiserror = { version = "1.0.58", default-features = false }

# Testing
serial_test = "3.2.0"

[lib]
path = "./src/lib.rs"


[dev-dependencies]
bincode = { version = "2.0.1", features = ["serde"] }


[dependencies]
jolt-atlas-core = { path = "./jolt-atlas-core" }

[profile.test]
opt-level = 3
lto = "off"

# Akita's debug-only self-checks dominate a test-profile prove (the exhaustive
# witness sweep runs 1.6x faster without them). Akita is tested upstream.
[profile.test.package.akita-algebra]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-challenges]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-config]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-cpu-backend]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-error]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-params]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-pcs]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-planner]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-prover]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-schedules]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-serialization]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-setup]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-sumcheck]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-transcript]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-types]
debug-assertions = false
overflow-checks = false

[profile.test.package.akita-verifier]
debug-assertions = false
overflow-checks = false

[profile.test.package.jolt-akita]
debug-assertions = false
overflow-checks = false

[profile.release]
debug = 1
overflow-checks = true
lto = "fat"

[profile.build-fast]
inherits = "release"
incremental = true
lto = "off"
overflow-checks = true

[profile.guest]
inherits = "release"
debug = false

[patch.crates-io]
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

# The Akita crates depend on jolt-field and jolt-poly by git; resolve them to the vendored copies
# so the graph holds one of each (as upstream's own workspace does).
[patch."https://github.com/a16z/jolt"]
jolt-field = { path = "./third_party/jolt-field" }
jolt-poly = { path = "./third_party/jolt-poly" }
