# Vendored from https://github.com/a16z/jolt crates/jolt-openings at rev
# f3265b5a9981f0c1359f2b63008824616f0c82fa, with workspace dependency
# inheritance resolved and the non-src targets removed (third_party/PINS.md).
[package]
name = "jolt-openings"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a16z/jolt"

[features]
default = ["bn254", "parallel"]
bn254 = ["jolt-crypto/bn254", "jolt-field/bn254"]
parallel = ["jolt-crypto/parallel", "jolt-poly/parallel"]

[dependencies]
jolt-crypto = { path = "../jolt-crypto", default-features = false }
jolt-field = { path = "../jolt-field", default-features = false }
jolt-poly = { path = "../jolt-poly", default-features = false, features = ["transcript"] }
jolt-transcript = { path = "../jolt-transcript", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = "2.0.18"
tracing = { version = "0.1.37", default-features = false, features = ["attributes"] }
