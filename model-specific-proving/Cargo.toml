[package]
name = "model-specific-proving"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"

[features]
safetensors-weights = ["dep:safetensors", "dep:half", "dep:atlas-trace", "dep:libm", "dep:serde_json"]

[[bin]]
name = "prove-model"
required-features = ["safetensors-weights"]

[dependencies]
bincode = "1.3"
tracing = "0.1"
tempfile = "3"
memmap2 = "0.9"
world-common = { package = "common", git = "https://github.com/worldfnd/BitZ.git", rev = "34addacd27d63b0929512bcc90fe95d256362b74" }
world-field = { package = "field", git = "https://github.com/worldfnd/BitZ.git", rev = "34addacd27d63b0929512bcc90fe95d256362b74" }
world-pcs = { package = "pcs", git = "https://github.com/worldfnd/BitZ.git", rev = "34addacd27d63b0929512bcc90fe95d256362b74" }
world-prover = { package = "prover", git = "https://github.com/worldfnd/BitZ.git", rev = "34addacd27d63b0929512bcc90fe95d256362b74" }
world-verifier = { package = "verifier", git = "https://github.com/worldfnd/BitZ.git", rev = "34addacd27d63b0929512bcc90fe95d256362b74" }
world-transcript = { package = "transcript", git = "https://github.com/worldfnd/BitZ.git", rev = "34addacd27d63b0929512bcc90fe95d256362b74" }
crypto-primitives = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "b744c74" }
num-traits = { version = "0.2" }
rand_core = { version = "0.6" }
safetensors = { version = "0.8", optional = true }
half = { version = "2", optional = true }
atlas-trace = { path = "../crates/atlas-trace", optional = true }
rayon = "1.10"
serde = { version = "1.0", default-features = false, features = ["derive", "rc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"], optional = true }
libm = { version = "0.2", optional = true }
jolt-field = { git = "https://github.com/ClankPan/jolt.git", rev = "5022101f9a38cff9c9b26289f0c27b124d0602d0", default-features = false, features = ["solinas"] }
jolt-poly = { git = "https://github.com/ClankPan/jolt.git", rev = "5022101f9a38cff9c9b26289f0c27b124d0602d0", default-features = false }
jolt-sumcheck = { git = "https://github.com/ClankPan/jolt.git", rev = "5022101f9a38cff9c9b26289f0c27b124d0602d0", default-features = false, features = ["prover"] }
jolt-transcript = { git = "https://github.com/ClankPan/jolt.git", rev = "5022101f9a38cff9c9b26289f0c27b124d0602d0", default-features = false, features = ["transcript-keccak", "prover-grinding"] }

[profile.test]
opt-level = 3
lto = "off"

[profile.release]
debug = 1
overflow-checks = true
lto = "fat"

[profile.build-fast]
inherits = "release"
incremental = true
lto = "off"
overflow-checks = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[patch."https://github.com/worldfnd/BitZ.git"]
gkr = { path = "vendor/world-bitz/gkr" }
post_gkr = { path = "vendor/world-bitz/post_gkr" }
prover = { path = "vendor/world-bitz/prover" }
