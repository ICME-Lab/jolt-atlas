# Vendored from https://github.com/a16z/jolt crates/jolt-crypto at rev
# f3265b5a9981f0c1359f2b63008824616f0c82fa, with workspace dependency
# inheritance resolved and the non-src targets removed (third_party/PINS.md).
[package]
name = "jolt-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a16z/jolt"

[features]
default = ["bn254", "parallel"]
bn254 = ["dep:ark-bn254", "dep:ark-ec", "dep:ark-ff", "dep:ark-serialize", "dep:ark-std", "dep:num-bigint", "dep:num-integer", "dep:num-traits", "jolt-field/bn254"]
parallel = ["dep:rayon", "jolt-poly/parallel"]

[dependencies]
jolt-field = { path = "../jolt-field", default-features = false }
jolt-poly = { path = "../jolt-poly", default-features = false }
jolt-transcript = { path = "../jolt-transcript", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
rand_core = { version = "0.6.4", default-features = false }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false, features = ["curve"], optional = true }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false, optional = true }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false, optional = true }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false, features = ["derive"], optional = true }
ark-std = { version = "0.5.0", default-features = false, optional = true }
num-bigint = { version = "0.4.6", default-features = false, optional = true }
num-integer = { version = "0.1.45", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false, optional = true }
rayon = { version = "1.12.0", optional = true }
