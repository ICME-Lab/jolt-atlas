[package]
name = "jolt-atlas-verifier"
version = "0.1.0"
edition = "2021"
description = "The jolt-atlas proof and its verifier, with no prover dependency."

[features]
akita = ["atlas-pcs/akita", "atlas-sumcheck/akita", "dep:bincode", "dep:blake3"]
# `&mut` accessors to the verifier's accumulator and transcript for tests. Inert unless called.
test-util = []

[dependencies]
atlas-trace.workspace = true
common.workspace = true
atlas-algebra.workspace = true
atlas-transcript.workspace = true
atlas-lookup-tables.workspace = true
atlas-sumcheck.workspace = true
atlas-pcs.workspace = true
atlas-claims.workspace = true
serde.workspace = true
bincode = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
tracing.workspace = true
