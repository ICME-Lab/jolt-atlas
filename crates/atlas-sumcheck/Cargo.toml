[package]
name = "atlas-sumcheck"
version = "0.1.0"
edition = "2021"
description = "Atlas sumcheck instances, the opening accumulators and the one-hot subprotocols."

[features]
akita = []
allocative = ["atlas-algebra/allocative"]
test-feature = ["atlas-algebra/test-feature", "atlas-transcript/test-feature"]

[dependencies]
# Internal
common.workspace = true
atlas-algebra.workspace = true
atlas-transcript.workspace = true
atlas-lookup-tables.workspace = true
atlas-claims.workspace = true
num-traits.workspace = true

# Parallel Processing
rayon.workspace = true

# Randomness
rand.workspace = true
rand_chacha = { version = "0.3.0", default-features = false }
rand_core.workspace = true
rand_distr = "0.4.3"

# Tracing and Profiling
tracing.workspace = true
allocative.workspace = true

# Core Utilities
thiserror = { workspace = true, default-features = true }
derive_more.workspace = true
itertools.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
atlas-transcript = { workspace = true, features = ["prover", "test-feature"] }
