# Vendored from https://github.com/a16z/jolt crates/jolt-riscv at rev
# f3265b5a9981f0c1359f2b63008824616f0c82fa, with workspace dependency
# inheritance resolved and the non-src targets removed (third_party/PINS.md).
[package]
name = "jolt-riscv"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/a16z/jolt"

[features]
default = ["serialization"]
serialization = ["dep:ark-serialize", "dep:serde"]
field-inline = []

[dependencies]
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout", default-features = false, features = ["derive"], optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
thiserror = "2.0.18"
