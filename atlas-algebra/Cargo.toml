[package]
name = "atlas-algebra"
version = "0.1.0"
edition = "2021"
description = "Atlas fields, multilinear polynomials and shared utilities."

[features]
allocative = ["dep:inferno"]
test-feature = []

[dependencies]
# Internal
common.workspace = true
atlas-trace.workspace = true

# Serialization
serde.workspace = true
bincode.workspace = true

# Numeric
num.workspace = true
num-traits.workspace = true

# Parallel Processing
rayon.workspace = true

# Randomness
rand = { workspace = true, features = ["std", "std_rng"] }
rand_chacha = { version = "0.3.0", default-features = false }
rand_core.workspace = true

# Tracing and Profiling
tracing = { workspace = true, features = ["attributes"] }
inferno = { version = "0.12.3", optional = true }
allocative.workspace = true

# Core Utilities
thiserror = { workspace = true, default-features = true }
strum.workspace = true
strum_macros.workspace = true

# System and Platform
memory-stats = { version = "1.0.0", features = ["always_use_statm"] }

[dev-dependencies]
tracing-subscriber.workspace = true
atlas-transcript = { workspace = true, features = ["prover", "test-feature"] }
